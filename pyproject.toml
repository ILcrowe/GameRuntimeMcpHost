[project]
name = "game-runtime-mcp-host"
version = "0.3.0"
description = "Dependency-free MCP runtime host with CLI-backed external-agent session adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lLcrowe" }]
keywords = ["mcp", "game-runtime", "localhost", "stdio", "llm", "codex", "grok"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ILcrowe/GameRuntimeMcpHost"
Repository = "https://github.com/ILcrowe/GameRuntimeMcpHost"
Issues = "https://github.com/ILcrowe/GameRuntimeMcpHost/issues"
Changelog = "https://github.com/ILcrowe/GameRuntimeMcpHost/blob/main/CHANGELOG.md"

[project.scripts]
game-runtime-mcp-host = "game_runtime_mcp_host:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "game_runtime_mcp_host",
  "game_runtime_agent_session",
  "game_runtime_codex_session",
  "game_runtime_grok_session",
]
package-dir = {"" = "src"}
