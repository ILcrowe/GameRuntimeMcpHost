name: Python 테스트

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.10 / Windows
    runs-on: windows-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python 구문 검사
        run: python -m compileall -q src tests

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
